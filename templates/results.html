<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Segmentation Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 40px auto;
            text-align: center;
            background: #f5f5f5;
        }
        h1 {
            color: #222;
        }
        .original {
            margin-bottom: 40px;
        }
        .original img {
            max-width: 300px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card img {
            max-width: 100%;
            border-radius: 6px;
        }
        .card h3 {
            margin: 12px 0 4px;
            color: #222;
        }
        .card p {
            color: #666;
            margin: 0;
        }
        a.back {
            display: inline-block;
            margin-top: 40px;
            color: #2b6cb0;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h1>Segmentation Results</h1>

    <div class="original">
        <h3>Original Image</h3>
        <img src="/{{ original_image }}" alt="Original upload">
    </div>

    <div class="grid">
        {% for r in results %}
        <div class="card">
            <h3>{{ r.name }}</h3>
            <img src="/{{ r.image_path }}" alt="{{ r.name }} output">
            <p>Runtime: {{ r.runtime }}s</p>
        </div>
        {% endfor %}
    </div>

    <a class="back" href="/">&larr; Try another image</a>
</body>
</html>
