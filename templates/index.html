<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Segmentation Comparison Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            background: #f5f5f5;
        }
        h1 {
            color: #222;
        }
        p.subtitle {
            color: #666;
            margin-bottom: 40px;
        }
        .upload-box {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        input[type="file"] {
            margin-bottom: 20px;
        }
        button {
            background: #2b6cb0;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #234e8c;
        }
        .error {
            color: #c0392b;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Image Segmentation Comparison Tool</h1>
    <p class="subtitle">Upload an image to compare graph-based vs. deep learning segmentation methods.</p>

    <div class="upload-box">
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="image" accept="image/*" required><br>
            <button type="submit">Run Segmentation</button>
        </form>
    </div>
</body>
</html>
